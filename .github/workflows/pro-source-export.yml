name: Pro source export

on:
  push:
    branches:
      - pro/get-bb-bb-gh2690-v1

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tar --exclude=.git -czf source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: source-tree
          path: source.tar.gz
          if-no-files-found: error
          retention-days: 1
